<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>knot 客户端</title>
<style>
/*
  配色照搬 herdr 那一套「零饱和中性灰 + 一点品牌绿」。两条取舍值得记一下，
  因为这个面板之前正是反着来的：

  1. 灰阶**不带色调**。原来用的 #0f1115 / #171a21 是偏蓝的板岩灰，和代码块、
     状态点那些彩色叠在一起显脏；纯灰让内容出彩，界面往后退。
  2. 绿只当**强调色**。「在跑 / 已连接」是「底抬一层 + 边框亮一点 + 文字变绿」，
     饱和填充只留给真正的主操作（接入、保存）。
*/
:root{
  /* 灰阶四档：画布 → 卡片 → 控件 → 控件 hover，每档差 ~8 个灰阶 */
  --bg:#121212; --bar:#1a1a1a; --ctl:#232323; --ctl-hi:#2c2c2c;
  /* line 常规分隔；line-hi 给 hover 和可交互的描边 */
  --line:#2a2a2a; --line-hi:#3d3d3d;
  /* 文字三档：正文 / 次要（标签说明）/ 更次要（占位、时间） */
  --fg:#ededed; --muted:#a0a0a0; --faint:#6f6f6f;
  --brand:#3ecf8e; --brand-bg:#1c6a47; --brand-line:#2b8f61; --brand-fg:#f2fdf7;
  --ok:#3ecf8e; --bad:#e5484d; --warn:#e0a33e;
  --r-card:12px; --r-ctl:6px;
  /* 不写这行，原生 <select> 弹出来的列表是白底黑字，点开一下晃眼 */
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{border:2px solid transparent;background-clip:padding-box;
  border-radius:999px;background-color:var(--line-hi)}
::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}

/* ---- 顶栏 ---- */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:var(--bar);border-bottom:1px solid var(--line)}
h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12px}
.tiny{font-size:11px;color:var(--faint)}
main{padding:20px;max-width:1040px;margin:0 auto}
section{background:var(--bar);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;margin-bottom:16px}
h2{font-size:12px;margin:0 0 14px;color:var(--muted);font-weight:600}

/* ---- 控件 ---- */
button{background:var(--ctl);color:var(--muted);border:1px solid var(--line);
  border-radius:var(--r-ctl);padding:6px 12px;font:inherit;font-size:12.5px;
  cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button:hover{background:var(--ctl-hi);border-color:var(--line-hi);color:var(--fg)}
/* 饱和填充只给主操作：深绿底 + 亮一档描边 + 近白字，而不是把亮绿涂满 */
button.primary{background:var(--brand-bg);border-color:var(--brand-line);color:var(--brand-fg);font-weight:500}
button.primary:hover{background:#207a52;border-color:#37a771;color:#fff}
button.danger{color:var(--bad);border-color:transparent;background:transparent}
button.danger:hover{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,select{background-color:var(--ctl);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--r-ctl);padding:6px 10px;font:inherit;font-size:13px;width:100%}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--brand-line)}
/* 接管原生控件的外观。不写的话 macOS 会自己画 <select> 右边那个双箭头和
   number 输入框的上下箭头 —— 系统画的是浅色小部件，贴在深色表单上像两块补丁。 */
select{
  appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a0a0a0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center}
select:hover{border-color:var(--line-hi)}
/* 端口是打出来的，不是点出来的 —— 步进箭头只占地方 */
input[type=number]{appearance:textfield;-webkit-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
label{display:block;color:var(--muted);font-size:11.5px;margin-bottom:5px}
code,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
code{font-size:12px;background:var(--ctl);padding:2px 6px;border-radius:4px;color:#cfd6e0}
a{color:var(--brand);text-decoration:none}

/* 「打开 / 在跑」不涂色块：底抬一层 + 描边亮一点 + 文字变绿 */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
  background:var(--ctl);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{border-color:var(--line-hi);color:var(--brand)}
.dot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:7px;
  vertical-align:middle;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--faint)} .dot.bad{background:var(--bad)}
/* 进行中用 warn 黄，不用绿 —— 绿在这套界面里已经是「已连接 / 在跑」的意思，
   一行里同时出现绿点和绿字，谁是谁分不出来。脉冲是「还在动」的唯一线索。 */
.dot.work{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.work{color:var(--warn)}
.on{color:var(--ok)} .off{color:var(--warn)} .bad{color:var(--bad)}

/* ---- 转发列表 ----
   grid 而不是 flex：列宽由网格定，每一行的状态和按钮才真的对齐。
   之前状态块是 flex:0 0 auto，宽度随内容变，有流量统计的那行就比别的行往左跑。 */
.fwd{display:grid;grid-template-columns:minmax(190px,1.1fr) minmax(190px,1.3fr) minmax(104px,auto) auto;
  align-items:center;gap:4px 18px;padding:13px 0;border-bottom:1px solid var(--line)}
.fwd:first-of-type{padding-top:2px;border-top:1px solid var(--line)}
.fwd:last-child{border-bottom:0;padding-bottom:4px}
.fwd .local{display:flex;align-items:center;min-width:0}
.fwd .name{color:var(--muted);margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fwd .to{color:var(--muted);min-width:0}
.fwd .st{font-size:12px;color:var(--muted)}
.fwd .acts{display:flex;gap:6px;justify-content:flex-end}
@media (width < 760px){
  .fwd{grid-template-columns:1fr auto;gap:6px 12px}
  .fwd .to{grid-column:1/-1;margin-left:14px}
  .fwd .st{grid-column:1}
}

/* ---- 表单 ---- */
.new{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:12px}
.fields .wide{grid-column:span 2}
.fields .full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---- 表格（网络） ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;
  padding:0 12px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0;padding-bottom:0}

/* ---- 其它 ---- */
#setup{max-width:400px;margin:9vh auto}
.err{color:var(--bad);font-size:12.5px;min-height:17px}
.hint{color:var(--faint);font-size:11.5px;line-height:1.6;margin-top:10px}
.log{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-ctl);
  padding:10px 12px;height:200px;overflow:auto;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);white-space:pre-wrap}
.empty{color:var(--faint);font-size:12.5px;padding:6px 0}
.arrow{color:var(--faint);margin-right:6px}
.check{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);font-size:12.5px}
.check input{width:auto;margin:0}
</style>
</head>
<body>

<!-- ------------------------------------------------------------ 接入 -->
<div id="setup" style="display:none">
  <section>
    <h2>接入 knot</h2>
    <div class="fields" style="grid-template-columns:1fr">
      <div><label>head 地址</label>
        <input id="sHead" placeholder="https://head.example.com" autofocus></div>
      <div><label>接入令牌</label>
        <input id="sToken" placeholder="在 head 面板「客户端」里签发"></div>
      <div><label>本机名称</label>
        <input id="sName" placeholder="留空 = 用这台电脑的名字"></div>
    </div>
    <label class="check" style="margin-bottom:12px">
      <input id="sInsec" type="checkbox"> head 用的是自签证书，跳过校验
    </label>
    <div class="err" id="sErr"></div>
    <button id="sBtn" class="primary" onclick="join()" style="width:100%">接入</button>
    <div class="hint">
      这台机器不会成为网络的节点：不占网内地址，别的节点也拨不到这里。<br>
      接入和注销都不会惊动网络里的其它机器。
    </div>
  </section>
</div>

<!-- ------------------------------------------------------------ 主界面 -->
<div id="app" style="display:none">
<header>
  <h1>knot</h1>
  <span class="sub" id="meta"></span>
  <span style="flex:1"></span>
  <span id="statePill"></span>
  <button id="btnRe" onclick="act('/api/reconnect', this, '重连中…')">重连</button>
  <button id="btnDis" onclick="act('/api/disconnect', this, '断开中…')">断开</button>
</header>
<main>

<div class="err" id="gErr" style="margin-bottom:12px"></div>

<section>
  <h2>端口转发</h2>
  <div class="row" style="margin-bottom:14px">
    <button class="primary" onclick="toggleNew()">+ 新建转发</button>
    <span class="tiny">本机的一个端口，接到某台机器能访问的一个地址上</span>
  </div>

  <div id="newBox" class="new" style="display:none">
    <div class="fields">
      <div><label>本地端口</label><input id="fLocal" type="number" placeholder="15432"></div>
      <div><label>在哪台机器上</label><select id="fNode" onchange="nodeChanged()"></select></div>
      <div class="wide"><label>它去连的地址</label><input id="fHost" placeholder="127.0.0.1"></div>
      <div><label>端口</label><input id="fPort" type="number" placeholder="5432"></div>
      <div class="full"><label>备注</label><input id="fLabel" placeholder="线上主库"></div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="row">
      <button class="primary" onclick="saveForward()">保存</button>
      <button onclick="toggleNew()">取消</button>
    </div>
    <div class="hint" id="fHint"></div>
  </div>

  <div id="fwdBody"></div>
  <div class="empty" id="fwdEmpty" style="display:none">还没有转发。点「新建转发」加一条。</div>
</section>

<section>
  <h2>网络</h2>
  <table><thead><tr>
    <th>节点</th><th>地址</th><th>角色</th><th>公网端点</th><th>隧道</th>
  </tr></thead><tbody id="nodeBody"></tbody></table>
</section>

<section>
  <h2>日志</h2>
  <div class="log" id="log"></div>
  <div class="row" style="margin-top:12px">
    <button onclick="forget()">注销身份</button>
    <span class="tiny">转发会保留，重新接入后还在</span>
  </div>
</section>

</main>
</div>

<script>
let S = null, editing = null, newOpen = false;

async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body || {}),
  });
  const t = await r.text();
  let j = {};
  try { j = t ? JSON.parse(t) : {}; } catch (e) { throw new Error(t || r.statusText); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh() {
  try {
    S = await api('/api/state');
    render();
  } catch (e) { /* 面板自己没连上，下一轮再说 */ }
}

function render() {
  setup.style.display = S.joined ? 'none' : 'block';
  app.style.display = S.joined ? 'block' : 'none';
  if (!S.joined) return;

  meta.textContent = `${S.name} @ ${S.head}`;
  const ok = S.status === '已连接' && S.singbox;
  const dot = S.connecting ? 'work' : ok ? 'on' : S.error ? 'bad' : 'off';
  statePill.innerHTML = `<span class="dot ${dot}"></span>` +
    `<span class="${S.connecting ? 'work' : 'sub'}">${esc(S.status)}</span>`;
  gErr.textContent = S.error || '';

  renderForwards();
  renderNodes();
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent = (S.logs || []).join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function renderForwards() {
  const rows = (S.forwards || []).map(f => {
    const st = f.stat || {};
    const cls = !f.enabled ? 'off' : (st.last_err ? 'bad' : (st.listening ? 'on' : 'off'));
    const state = !f.enabled ? '已停用'
      : st.last_err ? `<span class="bad">${esc(st.last_err)}</span>`
      : st.listening ? `${st.active || 0} 个连接`
      : '未监听';
    const traffic = (st.total || st.up || st.down)
      ? `<div class="tiny mono">${st.total || 0} 次 · ${fmtBytes(st.up)}↑ ${fmtBytes(st.down)}↓</div>` : '';
    return `<div class="fwd">
      <div class="local"><span class="dot ${cls}"></span><code>127.0.0.1:${f.local}</code>
        ${f.label ? `<span class="name">${esc(f.label)}</span>` : ''}</div>
      <div class="to"><span class="arrow">→</span><span class="pill on">${esc(f.node)}</span>
        上的 <code>${esc(f.host)}:${f.port}</code></div>
      <div class="st">${state}${traffic}</div>
      <div class="acts">
        <button onclick="toggleEnabled('${f.id}')">${f.enabled ? '停用' : '启用'}</button>
        <button onclick="editForward('${f.id}')">编辑</button>
        <button class="danger" onclick="delForward('${f.id}')">删除</button>
      </div>
    </div>`;
  });
  fwdBody.innerHTML = rows.join('');
  fwdEmpty.style.display = rows.length ? 'none' : 'block';
}

function renderNodes() {
  nodeBody.innerHTML = (S.nodes || []).map(n => {
    const r = (S.relays || []).find(r => r.name === n.name);
    const sess = !r ? ''
      : r.up ? '<span class="on">● 会话已建立</span>'
      : S.connecting ? '<span class="work"><span class="dot work"></span>连接中</span>'
      : '<span class="off">○ 未连接</span>';
    return `<tr>
      <td>${esc(n.name)}</td>
      <td><code>${esc(n.vip)}</code></td>
      <td>${r ? '<span class="pill on">中继</span>' : '<span class="pill">叶子</span>'}</td>
      <td class="tiny mono">${r ? esc(r.endpoint) : '—'}</td>
      <td class="tiny">${sess}</td></tr>`;
  }).join('');
}

// --------------------------------------------------------------- 新建/编辑

function toggleNew() {
  newOpen = !newOpen;
  newBox.style.display = newOpen ? 'block' : 'none';
  fErr.textContent = '';
  if (newOpen) { if (!editing) fillForm(null); fLocal.focus(); }
  else editing = null;
}

function fillForm(f) {
  editing = f;
  fNode.innerHTML = (S.nodes || []).map(n =>
    `<option value="${esc(n.name)}">${esc(n.name)}${n.is_relay ? '（中继）' : ''}</option>`).join('');
  if (f) {
    fLocal.value = f.local; fPort.value = f.port; fLabel.value = f.label || '';
    fNode.value = f.node; fHost.value = f.host;
  } else {
    fLocal.value = ''; fPort.value = ''; fLabel.value = ''; fHost.value = '127.0.0.1';
    if ((S.nodes || []).length) fNode.value = S.nodes[0].name;
  }
  nodeChanged();
}

function nodeChanged() {
  const n = (S.nodes || []).find(n => n.name === fNode.value);
  if (!fHost.value) fHost.value = '127.0.0.1';
  fHint.textContent = n
    ? `这个地址由 ${n.name} 去解析和连接，本机不需要能访问它。填 127.0.0.1 就是 ${n.name} 上的本地服务，也可以填它能访问的任何地址，比如内网域名或 VPC 私网地址。`
    : '';
}

function editForward(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  newOpen = true; newBox.style.display = 'block';
  fillForm(f);
  fLocal.focus();
}

async function saveForward() {
  const body = {
    id: editing ? editing.id : '',
    label: fLabel.value.trim(),
    local: Number(fLocal.value),
    node: fNode.value,
    host: fHost.value.trim() || '127.0.0.1',
    port: Number(fPort.value),
    enabled: editing ? editing.enabled : true,
  };
  try {
    await api('/api/forward', body);
    fErr.textContent = '';
    editing = null; newOpen = false; newBox.style.display = 'none';
    refresh();
  } catch (e) { fErr.textContent = e.message; }
}

async function toggleEnabled(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  const b = {...f, enabled: !f.enabled};
  delete b.stat;
  try { await api('/api/forward', b); refresh(); } catch (e) { gErr.textContent = e.message; }
}

async function delForward(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  if (!confirm(`删除转发 127.0.0.1:${f.local} → ${f.node} 上的 ${f.host}:${f.port}？`)) return;
  try { await api('/api/forward/delete', {id}); refresh(); } catch (e) { gErr.textContent = e.message; }
}

// ------------------------------------------------------------------- 其它

async function join() {
  sBtn.disabled = true; sErr.textContent = '';
  try {
    await api('/api/join', {
      head: sHead.value.trim(), token: sToken.value.trim(),
      name: sName.value.trim(), insecure: sInsec.checked,
    });
    refresh();
  } catch (e) { sErr.textContent = e.message; }
  sBtn.disabled = false;
}

// act 把按钮本身变成进度条。这个 POST 一直阻塞到 connect() 返回 —— 包含一次到
// head 的 HTTP 往返 —— 点下去之后没有任何反馈的话，看起来就像没点着。
async function act(path, btn, label) {
  const old = btn.textContent;
  btn.textContent = label;
  btnRe.disabled = btnDis.disabled = true;
  gErr.textContent = '';
  try { await api(path, {}); } catch (e) { gErr.textContent = e.message; }
  btn.textContent = old;
  btnRe.disabled = btnDis.disabled = false;
  refresh();
}

async function forget() {
  if (!confirm('注销这台机器的身份？转发会保留，但要重新签发凭证才能再连。')) return;
  try { await api('/api/forget', {}); } catch (e) { gErr.textContent = e.message; }
  refresh();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtBytes(n) {
  n = n || 0;
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'M';
  return (n / 1024 / 1024 / 1024).toFixed(2) + 'G';
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
