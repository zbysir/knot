<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>knot 客户端</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ec;--dim:#8b93a5;--acc:#5b9cf8;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:.04em}
.sub{color:var(--dim);font-size:12px}
main{padding:24px;max-width:1100px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px}
h2{font-size:13px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
code{font-size:12px;background:#0b0d11;padding:2px 6px;border-radius:4px;color:#cbd3e1}
button{background:var(--acc);color:#06121f;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
button.danger{background:transparent;color:var(--bad);border:1px solid #4a2020;font-weight:400}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:default}
input,select{background:#0b0d11;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
input:focus,select:focus{outline:1px solid var(--acc)}
label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.relay{color:var(--ok);border-color:#1d4429}
.leaf{color:var(--dim)}
.on{color:var(--ok)} .off{color:var(--warn)} .bad{color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)} .dot.bad{background:var(--bad)}
#setup{max-width:420px;margin:10vh auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hint{color:var(--dim);font-size:12px;margin-top:8px}
.log{background:#0b0d11;border:1px solid var(--line);border-radius:6px;padding:10px;height:220px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#9fb0c8;white-space:pre-wrap}
.empty{color:var(--dim);font-size:13px;padding:10px 0}
.arrow{color:var(--dim);margin:0 6px}
.new{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
td.nw,th.nw{white-space:nowrap}
.acts{text-align:right;white-space:nowrap}
.acts button{padding:3px 8px;font-size:11.5px;margin-left:3px}
header .acts button{padding:6px 12px;font-size:13px}
.tiny{font-size:11px;color:#7b8794}
/* 转发用自适应的行，不用表格：这个窗口通常只有 600 来像素宽，
   五列表格在那个宽度下要么逐字换行，要么把按钮挤出卡片外面。 */
.fwd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 0;border-bottom:1px solid var(--line)}
.fwd:last-child{border-bottom:0}
.fwd .who{flex:1 1 240px;min-width:0}
.fwd .to{margin-left:13px;margin-top:2px}
.fwd .st{flex:0 0 auto;font-size:12px;color:var(--dim)}
.fwd .acts{margin-left:auto}
.fwd code{word-break:break-all}
.grow{flex:1;min-width:150px}
</style>
</head>
<body>

<!-- ------------------------------------------------------------ 接入 -->
<div id="setup" style="display:none">
  <section>
    <h2>接入 knot</h2>
    <label>head 地址</label>
    <input id="sHead" style="width:100%" placeholder="https://head.example.com:8080" autofocus>
    <label style="margin-top:10px">接入令牌</label>
    <input id="sToken" style="width:100%" placeholder="在 head 面板里生成「客户端」令牌">
    <label style="margin-top:10px">本机名称</label>
    <input id="sName" style="width:100%" placeholder="留空 = 用这台电脑的名字">
    <label style="margin-top:12px;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input id="sInsec" type="checkbox" style="width:auto;margin:0"> head 用的是自签证书，跳过校验
    </label>
    <div class="err" id="sErr"></div>
    <button id="sBtn" onclick="join()" style="width:100%">接入</button>
    <div class="hint">
      只读客户端：本机不占用网络地址，别的节点访问不到这里。<br>
      接入和注销都不会惊动网络里的其它机器。
    </div>
  </section>
</div>

<!-- ------------------------------------------------------------ 主界面 -->
<div id="app" style="display:none">
<header>
  <h1>knot 客户端</h1>
  <span class="sub" id="meta"></span>
  <span style="flex:1"></span>
  <span id="statePill"></span>
  <span class="acts">
    <button class="ghost" onclick="act('/api/reconnect')">重连</button>
    <button class="ghost" onclick="act('/api/disconnect')">断开</button>
    <button class="ghost" onclick="quit()">退出</button>
  </span>
</header>
<main>

<div class="err" id="gErr" style="margin-bottom:12px"></div>

<section>
  <h2>端口转发</h2>
  <div class="row" style="margin-bottom:14px">
    <button onclick="toggleNew()">+ 新建转发</button>
    <span class="sub">本机的一个端口，接到某个节点能访问的一个地址上</span>
  </div>

  <div id="newBox" class="new" style="display:none">
    <div class="row">
      <div><label>本地端口</label><input id="fLocal" type="number" placeholder="15432" style="width:110px"></div>
      <div><label>在哪台机器上</label><select id="fNode" onchange="nodeChanged()" style="width:170px"></select></div>
      <div class="grow"><label>它去连的地址</label><input id="fHost" placeholder="127.0.0.1" style="width:100%"></div>
      <div><label>端口</label><input id="fPort" type="number" placeholder="5432" style="width:100px"></div>
      <div class="grow"><label>备注</label><input id="fLabel" placeholder="线上主库" style="width:100%"></div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="row">
      <button onclick="saveForward()">保存</button>
      <button class="ghost" onclick="toggleNew()">取消</button>
      <span class="sub" id="fHint"></span>
    </div>
  </div>

  <div id="fwdBody"></div>
  <div class="empty" id="fwdEmpty" style="display:none">还没有转发。点「新建转发」加一条。</div>
</section>

<section>
  <h2>网络</h2>
  <table><thead><tr><th>节点</th><th>地址</th><th>角色</th><th>公网端点</th><th>隧道</th></tr></thead>
  <tbody id="nodeBody"></tbody></table>
</section>

<section>
  <h2>日志</h2>
  <div class="log" id="log"></div>
</section>

</main>
</div>

<script>
let S = null, editing = null, newOpen = false, pinned = false;

async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body || {}),
  });
  const t = await r.text();
  let j = {};
  try { j = t ? JSON.parse(t) : {}; } catch (e) { throw new Error(t || r.statusText); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh() {
  try {
    S = await api('/api/state');
    render();
  } catch (e) { /* 面板自己没连上，下一轮再说 */ }
}

function render() {
  setup.style.display = S.joined ? 'none' : 'block';
  app.style.display = S.joined ? 'block' : 'none';
  if (!S.joined) return;

  meta.textContent = `${S.name} @ ${S.head}`;
  const ok = S.status === '已连接' && S.singbox;
  statePill.innerHTML = `<span class="dot ${ok ? 'on' : (S.error ? 'bad' : 'off')}"></span>` +
    `<span class="sub">${S.status}${S.singbox ? '' : '（sing-box 未运行）'}</span>`;
  gErr.textContent = S.error || '';

  renderForwards();
  renderNodes();
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  log.textContent = (S.logs || []).join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function renderForwards() {
  const rows = (S.forwards || []).map(f => {
    const st = f.stat || {};
    const cls = !f.enabled ? 'off' : (st.last_err ? 'bad' : (st.listening ? 'on' : 'off'));
    const label = f.label ? ` <span class="sub">${esc(f.label)}</span>` : '';
    const state = !f.enabled ? '已停用'
      : st.last_err ? `<span class="bad">${esc(st.last_err)}</span>`
      : st.listening ? `${st.active || 0} 个连接`
      : '未监听';
    const traffic = (st.total || st.up || st.down)
      ? `<div class="tiny mono">${st.total || 0} 次 · ${fmtBytes(st.up)}↑ ${fmtBytes(st.down)}↓</div>` : '';
    return `<div class="fwd">
      <div class="who">
        <div><span class="dot ${cls}"></span><code>127.0.0.1:${f.local}</code>${label}</div>
        <div class="to sub"><span class="arrow">→</span><span class="pill relay">${esc(f.node)}</span>
          上的 <code>${esc(f.host)}:${f.port}</code></div>
      </div>
      <div class="st">${state}${traffic}</div>
      <div class="acts">
        <button class="ghost" onclick="toggleEnabled('${f.id}')">${f.enabled ? '停用' : '启用'}</button>
        <button class="ghost" onclick="editForward('${f.id}')">编辑</button>
        <button class="danger" onclick="delForward('${f.id}')">删除</button>
      </div>
    </div>`;
  });
  fwdBody.innerHTML = rows.join('');
  fwdEmpty.style.display = rows.length ? 'none' : 'block';
}

function renderNodes() {
  nodeBody.innerHTML = (S.nodes || []).map(n => {
    const r = (S.relays || []).find(r => r.name === n.name);
    const sess = r ? (r.up ? '<span class="on">● 会话已建立</span>' : '<span class="off">○ 未连接</span>') : '';
    return `<tr>
      <td>${esc(n.name)}</td>
      <td><code>${esc(n.vip)}</code></td>
      <td>${r ? '<span class="pill relay">中继</span>' : '<span class="pill leaf">叶子</span>'}</td>
      <td class="sub mono">${r ? esc(r.endpoint) : '—'}</td>
      <td class="sub">${sess}</td></tr>`;
  }).join('');
}

// --------------------------------------------------------------- 新建/编辑

function toggleNew() {
  newOpen = !newOpen;
  newBox.style.display = newOpen ? 'block' : 'none';
  fErr.textContent = '';
  if (newOpen) { if (!editing) fillForm(null); fLocal.focus(); }
  else editing = null;
}

function fillForm(f) {
  editing = f;
  fNode.innerHTML = (S.nodes || []).map(n =>
    `<option value="${esc(n.name)}">${esc(n.name)}${n.is_relay ? ' （中继）' : ''}</option>`).join('');
  if (f) {
    fLocal.value = f.local; fPort.value = f.port; fLabel.value = f.label || '';
    fNode.value = f.node; fHost.value = f.host;
  } else {
    fLocal.value = ''; fPort.value = ''; fLabel.value = ''; fHost.value = '127.0.0.1';
    if ((S.nodes || []).length) fNode.value = S.nodes[0].name;
  }
  nodeChanged();
}

function nodeChanged() {
  const n = (S.nodes || []).find(n => n.name === fNode.value);
  if (!fHost.value) fHost.value = '127.0.0.1';
  fHint.textContent = n
    ? `这个地址由 ${n.name} 去解析和连接，本机不需要能访问它。填 127.0.0.1 就是 ${n.name} 上的本地服务，` +
      `也可以填它能访问的任何地址，比如内网域名或 VPC 私网地址。`
    : '';
}

function editForward(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  newOpen = true; newBox.style.display = 'block';
  fillForm(f);
  fLocal.focus();
}

async function saveForward() {
  const body = {
    id: editing ? editing.id : '',
    label: fLabel.value.trim(),
    local: Number(fLocal.value),
    node: fNode.value,
    host: fHost.value.trim() || '127.0.0.1',
    port: Number(fPort.value),
    enabled: editing ? editing.enabled : true,
  };
  try {
    await api('/api/forward', body);
    fErr.textContent = '';
    editing = null; newOpen = false; newBox.style.display = 'none';
    refresh();
  } catch (e) { fErr.textContent = e.message; }
}

async function toggleEnabled(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  const b = {...f, enabled: !f.enabled};
  delete b.stat;
  try { await api('/api/forward', b); refresh(); } catch (e) { gErr.textContent = e.message; }
}

async function delForward(id) {
  const f = S.forwards.find(f => f.id === id);
  if (!f) return;
  if (!confirm(`删除转发 127.0.0.1:${f.local} → ${f.host}:${f.port}？`)) return;
  try { await api('/api/forward/delete', {id}); refresh(); } catch (e) { gErr.textContent = e.message; }
}

// ------------------------------------------------------------------- 其它

async function join() {
  sBtn.disabled = true; sErr.textContent = '';
  try {
    await api('/api/join', {
      head: sHead.value.trim(), token: sToken.value.trim(),
      name: sName.value.trim(), insecure: sInsec.checked,
    });
    refresh();
  } catch (e) { sErr.textContent = e.message; }
  sBtn.disabled = false;
}

async function act(path) {
  try { await api(path, {}); } catch (e) { gErr.textContent = e.message; }
  refresh();
}

async function quit() {
  if (!confirm('退出 knot 客户端？所有转发都会关闭。')) return;
  try { await api('/api/quit', {}); } catch (e) {}
  document.body.innerHTML = '<div style="padding:24px;color:#8b93a5">已退出，可以关掉这个页面了。</div>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtBytes(n) {
  n = n || 0;
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'M';
  return (n / 1024 / 1024 / 1024).toFixed(2) + 'G';
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
